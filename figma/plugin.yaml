name: figma
version: 0.1.0
manifest_version: 1
description: "Read, search, comment on, and export from Figma files via the REST API."
author: "Nocetic"
kind: standalone
requires_env:
  - FIGMA_ACCESS_TOKEN
provides_tools:
  - figma_file_info
  - figma_read
  - figma_export
  - figma_search
  - figma_comment_add
provides_commands:
  - figma
provides_skills:
  - design-handoff
